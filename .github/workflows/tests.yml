name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same ref cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mysql:
        image: mysql:8.4
        env:
          # throw-away database of this job only: nothing here is a secret
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: easyco_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: easyco_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sodium, sqlite3, xml, xsl, zip
          coverage: none

      # node: a few tests run the storefront / menu scripts under node (they skip without it)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # the views load CSS/JS through @vite: public/build is not in git, so CI builds it (same as the owner's PC)
      - name: Build front-end assets
        run: npm ci && npm run build

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # a throw-away key for this job (never stored, never printed)
      - name: App key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Shards are exactly the full list
        run: php scripts/ci/shard.php --verify

      - name: Write this shard's PHPUnit config
        run: php scripts/ci/shard.php --shard=${{ matrix.shard }}

      # SandboxTestEnvironmentTest removes DB_DATABASE from the process on purpose and expects .env.testing to name the test database
      - name: Test database name for .env.testing
        run: echo "DB_DATABASE=easyco_testing" > .env.testing

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.shard.xml --colors=never --log-junit junit-shard-${{ matrix.shard }}.xml

      - name: Summary
        if: always()
        run: php scripts/ci/summary.php junit-shard-${{ matrix.shard }}.xml "Shard ${{ matrix.shard }}/4" >> "$GITHUB_STEP_SUMMARY"

      - name: JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: junit-shard-${{ matrix.shard }}.xml
          retention-days: 7
          if-no-files-found: ignore

  # P8c-1: the Varnish VCL. The .vtc files run in the VERY image the stack uses (Dockerfile target `varnish`), so a vmod missing from the image fails here, not on the server.
  # Required: a red run fails the workflow like a PHPUnit shard does.
  varnish:
    name: Varnish VCL (varnishtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build the varnish image
        run: docker build --target varnish --tag easyco-varnish:ci .

      - name: Vmods the VCL imports are in the image
        run: |
          for vmod in std var xkey vsthrottle; do
            docker run --rm --entrypoint ls easyco-varnish:ci "/usr/lib/varnish/vmods/libvmod_${vmod}.so"
          done

      # the VCL is rendered from the template exactly as the container does at start, then compiled by varnishd itself
      - name: Compile the rendered VCL
        run: >-
          docker run --rm --add-host web:127.0.0.1 --entrypoint sh easyco-varnish:ci
          -c 'mkdir -p /tmp/vcl && easyco-render-vcl /etc/varnish /tmp/vcl && cp /etc/varnish/default.vcl /tmp/vcl/ && varnishd -C -p vcl_path=/tmp/vcl -f /tmp/vcl/default.vcl > /dev/null'

      - name: varnishtest
        run: >-
          docker run --rm --user root --entrypoint /work/run-tests.sh
          --volume "$PWD/docker/varnish:/work:ro" easyco-varnish:ci

      # 1. NO backend (192.0.2.1 is a documentation address nothing answers; NOT 127.0.0.1, that would be varnish itself): the container starts with the rendered VCL and answers. The fetch fails,
      #    so a 503 that carries OUR X-Cache header proves the rules run. (`default` has no probe, so the 503 is the real connection failure, not a decision of the probe.)
      - name: Container smoke test (no backend)
        run: |
          docker run -d --name vsmoke --add-host web:192.0.2.1 -p 8081:80 easyco-varnish:ci
          for i in $(seq 1 20); do curl -s -o /dev/null --max-time 30 http://127.0.0.1:8081/ && break; sleep 1; done
          curl -si --max-time 30 http://127.0.0.1:8081/ | tee /dev/stderr | grep -i '^x-cache: MISS'
          docker logs vsmoke
          docker rm -f vsmoke

      # 2. A REAL backend that answers GET /up with 200 (and nothing else): the `health` backend of default.vcl (the probe) must stay HEALTHY. It starts healthy (.initial), so the check waits for the
      #    whole probe window (5 probes x 5 s) and looks again: a probe that is wrong (path, Host) would have turned it sick by then (which only allows old copies; it never refuses a request).
      - name: Container smoke test (the health probe)
        run: |
          docker network create vnet
          docker run -d --name web --network vnet python:3.12-alpine sh -c 'mkdir /s && echo ok > /s/up && echo home > /s/index.html && cd /s && exec python -m http.server 80'
          docker run -d --name vprobe --network vnet -p 8082:80 easyco-varnish:ci
          sleep 40
          # two rows: `default` (no probe, fetches everything) and `health` (the probe, never fetches). It is the `health` row that must say healthy.
          docker exec vprobe varnishadm backend.list | tee /dev/stderr | grep -E '\.health[[:space:]]' | grep -i 'healthy'
          curl -si --max-time 10 http://127.0.0.1:8082/up | tee /dev/stderr | head -1 | grep ' 200 '
          curl -si --max-time 10 http://127.0.0.1:8082/ | tee /dev/stderr | grep -i '^x-cache: MISS'
          docker logs vprobe
          docker rm -f vprobe web
