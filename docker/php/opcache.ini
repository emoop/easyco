; EasyCo (DOCKER-1): the code of an image never changes while it runs, so timestamps are not checked
; (a new deploy = a new container = a fresh cache).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
