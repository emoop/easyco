; EasyCo (DOCKER-1): production defaults for php-fpm. Upload sizes are NOT here: they come from the pool template (PHP_UPLOAD_MAX_FILESIZE etc.).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 300
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.assertions = -1
